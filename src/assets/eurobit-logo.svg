          fill="#F68B1F">b</text>

    <text x="620" y="190"
          font-family="Arial, Helvetica, sans-serif"
          font-size="220"
          font-weight="700"
          letter-spacing="-12"
          fill="#0A1F44">it</text>

    <circle cx="695" cy="18" r="16" fill="#F68B1F"/>

    <text x="835" y="55"
          font-family="Arial, Helvetica, sans-serif"
